---
# ═══════════════════════════════════════════════════════════════════════
# Deploy the UNRIVAL fixture film to a Raspberry Pi 4 as a boot-to-kiosk.
#
#   Target verified on: Raspberry Pi 4 + Debian 13 (trixie), Wayland/labwc,
#   GeeekPi 9" 1280x720 panel. Also works on Raspberry Pi OS (labwc/wayfire).
#
#   • rsync the static site to the Pi (user's home — no root)
#   • a single kiosk-launch.sh starts the python static server AND Chromium
#   • labwc + wayfire autostart run that script every session = every boot
#   • the ONLY privileged step is the apt install (tag: packages)
#
# Usage:
#   cd ansable
#   # fresh Pi (needs to install chromium etc.):
#   ansible-playbook -i inventory.ini deploy_pi4.yml --ask-become-pass
#   # already-provisioned Pi (chromium present) — no sudo needed at all:
#   ansible-playbook -i inventory.ini deploy_pi4.yml --skip-tags packages
#
# Prerequisite: the login user autostarts into a Wayland (labwc/wayfire)
# session — Raspberry Pi OS desktop and this Pi already do (autologin on).
#
# Then reboot the Pi to start the kiosk.
# ═══════════════════════════════════════════════════════════════════════
- hosts: pi4
  vars_files:
    - config.yml

  tasks:
    # ── Control machine: make sure the offline-vendored libs exist ───────
    - name: Check for vendored three.js on the control machine
      delegate_to: localhost
      ansible.builtin.stat:
        path: "{{ local_project_path }}/assets/vendor/three/three.module.js"
      register: vendor_three

    - name: Vendor three.js + gsap locally if missing (offline-safe runtime)
      delegate_to: localhost
      when: not vendor_three.stat.exists
      ansible.builtin.shell: |
        set -e
        mkdir -p assets/vendor/three
        tmp=$(mktemp -d)
        curl -fsSL "https://registry.npmjs.org/three/-/three-{{ three_version }}.tgz" -o "$tmp/three.tgz"
        tar -xzf "$tmp/three.tgz" -C "$tmp"
        cp "$tmp/package/build/three.module.js" assets/vendor/three/three.module.js
        rm -rf assets/vendor/three/jsm
        cp -R "$tmp/package/examples/jsm" assets/vendor/three/jsm
        curl -fsSL "https://cdn.jsdelivr.net/npm/gsap@{{ gsap_version }}/dist/gsap.min.js" -o assets/vendor/gsap.min.js
        rm -rf "$tmp"
      args:
        chdir: "{{ local_project_path }}"

    # ── Pi: packages (the ONLY privileged step; skip if already installed) ─
    - name: Install kiosk packages on the Pi
      become: yes
      tags: packages
      ansible.builtin.apt:
        name:
          - chromium           # the kiosk browser (Debian/trixie package name)
          - python3            # static file server (usually preinstalled)
          - rsync              # for the synchronize tasks below
          - curl               # launch script waits on the server with it
        state: present
        update_cache: yes

    # ── Pi: ship the static site (into the user's home — no root) ────────
    - name: Ensure the project directory exists
      ansible.builtin.file:
        path: "{{ remote_base_path }}/{{ project_name }}"
        state: directory
        mode: '0755'

    - name: Sync site directories to the Pi
      ansible.builtin.synchronize:
        src: "{{ local_project_path }}/{{ item }}/"
        dest: "{{ remote_base_path }}/{{ project_name }}/{{ item }}/"
        delete: yes
        rsync_opts:
          - "--chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r"
          - "--exclude=storm1flex-hi"   # hi-res source art, not needed at runtime
      loop:
        - css
        - js
        - assets

    - name: Copy index.html to the Pi
      ansible.builtin.copy:
        src: "{{ local_project_path }}/index.html"
        dest: "{{ remote_base_path }}/{{ project_name }}/index.html"
        mode: '0644'

    # ── Pi: one script starts the static server AND the kiosk browser ────
    - name: Install the kiosk launch script (server + Chromium)
      ansible.builtin.copy:
        dest: "{{ remote_base_path }}/{{ project_name }}/kiosk-launch.sh"
        mode: '0755'
        content: |
          #!/usr/bin/env bash
          set -u
          PORT={{ http_port }}
          DIR="{{ remote_base_path }}/{{ project_name }}"
          URL="{{ kiosk_url }}"
          PROFILE="$HOME/.config/chromium-kiosk"

          # Start the static server if it isn't already running
          if ! pgrep -f "http.server $PORT" >/dev/null 2>&1; then
            setsid /usr/bin/python3 -m http.server "$PORT" --bind 127.0.0.1 \
              --directory "$DIR" >/tmp/{{ project_name }}-http.log 2>&1 &
          fi

          # Wait until the server is actually answering
          until curl -fsS "$URL" >/dev/null 2>&1; do sleep 1; done

          # A power-cut leaves Chromium thinking it crashed -> "Restore pages?"
          # bar. Scrub that flag so the kiosk always comes up clean.
          PREF="$PROFILE/Default/Preferences"
          if [ -f "$PREF" ]; then
            sed -i 's/"exited_cleanly":false/"exited_cleanly":true/; s/"exit_type":"[^"]*"/"exit_type":"Normal"/' "$PREF"
          fi

          exec chromium \
            --kiosk \
            --app="$URL" \
            --user-data-dir="$PROFILE" \
            --ozone-platform=wayland \
            --start-fullscreen \
            --noerrdialogs \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --disable-restore-session-state \
            --disable-features=Translate,TranslateUI \
            --check-for-update-interval=31536000 \
            --autoplay-policy=no-user-gesture-required \
            --password-store=basic \
            `# ^ skip the GNOME keyring prompt that otherwise blocks the kiosk` \
            `# --- Pi 4 GPU: hardware-accelerate WebGL via the V3D driver ---` \
            --ignore-gpu-blocklist \
            --enable-gpu-rasterization \
            --enable-zero-copy \
            --canvas-oop-rasterization \
            --disable-software-rasterizer

    # ── Pi: autostart the launcher under whichever Wayland compositor runs ─
    - name: Ensure ~/.config/labwc exists
      ansible.builtin.file:
        path: "{{ remote_base_path }}/.config/labwc"
        state: directory
        mode: '0755'

    - name: labwc - run the kiosk launcher on session start
      ansible.builtin.copy:
        dest: "{{ remote_base_path }}/.config/labwc/autostart"
        mode: '0755'
        content: |
          # UNRIVAL fixture film kiosk (starts the static server + Chromium)
          {{ remote_base_path }}/{{ project_name }}/kiosk-launch.sh &

    - name: wayfire - run the kiosk launcher on session start
      community.general.ini_file:
        path: "{{ remote_base_path }}/.config/wayfire.ini"
        section: autostart
        option: unrival_kiosk
        value: "{{ remote_base_path }}/{{ project_name }}/kiosk-launch.sh"
        mode: '0644'
        create: yes

    - name: wayfire - never blank the screen while the kiosk is fullscreen
      community.general.ini_file:
        path: "{{ remote_base_path }}/.config/wayfire.ini"
        section: idle
        option: "{{ item.k }}"
        value: "{{ item.v }}"
        mode: '0644'
      loop:
        - { k: "dpms_timeout", v: "-1" }
        - { k: "disable_on_fullscreen", v: "true" }

    # ── Pi: desktop autologin (Raspberry Pi OS only; this Pi already has it) ─
    - name: Detect raspi-config (Raspberry Pi OS)
      ansible.builtin.command: which raspi-config
      register: raspi_config_bin
      changed_when: false
      failed_when: false

    - name: Enable desktop autologin (Raspberry Pi OS)
      become: yes
      tags: packages
      ansible.builtin.command: raspi-config nonint do_boot_behaviour B4
      changed_when: false
      when: raspi_config_bin.rc == 0

    - name: Autologin prerequisite note (non-Raspberry-Pi-OS)
      ansible.builtin.debug:
        msg: >-
          raspi-config not found — make sure the login user autostarts into a
          labwc/wayfire Wayland session (this Pi already does via autologin).
      when: raspi_config_bin.rc != 0

    - name: Reminder
      ansible.builtin.debug:
        msg: "Deployed. Reboot the Pi to bring the kiosk up fullscreen."
